<!doctype html><html lang='en'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>Space Dragon — SFX Preview</title>
<style>body{background:#0b1020;color:#edf4ff;font:16px system-ui,sans-serif;max-width:850px;margin:32px auto;padding:16px}h1{font-size:2.1rem}p{color:#b7c5d8}section{border:1px solid #40526a;border-radius:14px;padding:14px;margin:10px 0;display:flex;align-items:center;justify-content:space-between;gap:15px}audio{max-width:52%;min-width:220px}small{display:block;color:#94abc8;margin-top:5px}footer{margin:32px 0;color:#a4b8d0}</style></head><body>
<h1>Space Dragon — Sound Bank Preview</h1><p>16 original procedural sound candidates. Not professional pack recordings. Hearing, mix and game-integration QA still pending.</p><main id='list'></main><footer>Playback is local to the cloned repository. This preview page is not the game.</footer>
<script>const tracks=[{"id":"sos_broken_signal","duration":3.2,"event":"sos.broken"},{"id":"pod_entry","duration":3.4,"event":"pod.entry"},{"id":"pod_impact","duration":2.2,"event":"pod.impact"},{"id":"core_activation","duration":2.3,"event":"core.activate"},{"id":"hologram_reveal","duration":1.9,"event":"core.hologram"},{"id":"suit_assemble","duration":2.1,"event":"suit.assemble"},{"id":"paul_pulse","duration":1.6,"event":"paul.pulse"},{"id":"maria_heal","duration":2.3,"event":"maria.heal"},{"id":"luke_web","duration":1,"event":"luke.web"},{"id":"luna_goo","duration":1.5,"event":"luna.goo"},{"id":"lyla_scan","duration":1.8,"event":"lyla.scan"},{"id":"dragon_awaken","duration":3.5,"event":"dragon.awaken"},{"id":"dragon_thruster","duration":3,"event":"dragon.thruster"},{"id":"dragon_cruise_loop","duration":4.5,"event":"dragon.cruise"},{"id":"combat_parry","duration":0.95,"event":"combat.parry"},{"id":"portal_open","duration":3.7,"event":"portal.open"}];
const root=document.querySelector('#list');for(const t of tracks){const section=document.createElement('section');const info=document.createElement('div');const title=document.createElement('strong');title.textContent=t.id.replaceAll('_',' ').toUpperCase();const meta=document.createElement('small');meta.textContent=t.event+' • '+t.duration+'s';info.append(title,meta);const audio=document.createElement('audio');audio.controls=true;audio.preload='none';audio.src='../assets/game/audio/starter/'+t.id+'.wav';section.append(info,audio);root.append(section);}</script></body></html>
