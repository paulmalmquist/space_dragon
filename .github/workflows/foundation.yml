name: Foundation and game checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  foundation:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Check guidance and skill mirrors
        run: python3 tools/check_foundation.py
      - name: Test the foundation checker
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v
      - name: Verify approved reference inventory
        run: python3 tools/verify_family_references.py

  game:
    runs-on: ubuntu-24.04
    # Independent runners keep the rendered driving route from delaying every
    # other suite. Each suite retains the same cases and one browser worker.
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: earth
            command: npm test -- tests/first-contact.spec.ts tests/navigation.spec.ts tests/gamepad.spec.ts
          - suite: drive
            command: npm test -- tests/drive.spec.ts tests/drive-traffic.spec.ts
          - suite: dogfight
            command: npm test -- tests/dogfight.spec.ts tests/word-lock.spec.ts tests/cockpit.spec.ts tests/mechanical.spec.ts tests/asteroid-crash.spec.ts
          - suite: production
            command: npm run test:production
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          lfs: true
      - name: Set up Node 24
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - name: Install exact project dependencies
        run: npm ci
      - name: Test story state and persistence
        run: npm run test:unit
      - name: Type-check and build the game
        run: npm run build
      - name: Install Chromium and Linux browser dependencies
        run: npx --no-install playwright install --with-deps chromium
      - name: Test ${{ matrix.suite }} gameplay and boundaries
        run: ${{ matrix.command }}
      - name: Retain browser failure evidence
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: browser-failure-evidence-${{ matrix.suite }}
          path: |
            artifacts/test-results/
            artifacts/production-test-results/
          if-no-files-found: ignore
          retention-days: 7
