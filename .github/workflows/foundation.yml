name: Foundation checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  foundation:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Check guidance and skill mirrors
        run: python3 tools/check_foundation.py
      - name: Test the foundation checker
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v
      - name: Verify approved reference inventory
        run: python3 tools/verify_family_references.py
